<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c96442">
<title>My AI Assistant</title>
<style>
:root{--bg:#faf9f7;--surface:#fff;--text:#1f1e1d;--muted:#6b6a66;--accent:#c96442;--ai:#efece6;--border:#e3e0d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1a1918;--surface:#262524;--text:#f0eee9;--muted:#9a978f;--ai:#2f2d2b;--border:#3a3835;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
h1{font-size:17px;margin:0}
header button{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:13px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:var(--ai);border-bottom-left-radius:4px}
.hint{color:var(--muted);text-align:center;margin:auto;max-width:280px}
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:var(--surface)}
textarea{flex:1;resize:none;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:20px;padding:10px 14px;font:inherit;max-height:120px}
#send{background:var(--accent);color:#fff;border:0;border-radius:20px;padding:0 18px;font-weight:600}
#send:disabled{opacity:.5}
</style>
</head>
<body>
<header><h1>My AI Assistant</h1><button id="clear" type="button">New chat</button></header>
<div id="log"><div class="hint" id="hint">Hi! Ask me anything.</div></div>
<form id="f">
<textarea id="t" rows="1" placeholder="Type a message…"></textarea>
<button id="send" type="submit">Send</button>
</form>
<script>
const log = document.getElementById("log");
const t = document.getElementById("t");
const send = document.getElementById("send");
let history = [];
let busy = false;

try {
  const saved = JSON.parse(localStorage.getItem("chat"));
  if (Array.isArray(saved)) history = saved;
} catch (e) {}

function save() {
  try { localStorage.setItem("chat", JSON.stringify(history.slice(-20))); } catch (e) {}
}

function add(role, text) {
  const h = document.getElementById("hint");
  if (h) h.remove();
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "ai");
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

history.forEach(function (m) { add(m.role, m.content); });

document.getElementById("clear").onclick = function () {
  history = [];
  save();
  log.innerHTML = '<div class="hint" id="hint">New chat started. Ask me anything.</div>';
};

t.addEventListener("input", function () {
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 120) + "px";
});

document.getElementById("f").addEventListener("submit", async function (e) {
  e.preventDefault();
  const text = t.value.trim();
  if (!text || busy) return;
  busy = true;
  send.disabled = true;
  t.value = "";
  t.style.height = "auto";
  history.push({ role: "user", content: text });
  add("user", text);
  const bubble = add("ai", "…");
  try {
    const r = await fetch("/.netlify/functions/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history.slice(-12) })
    });
    let data = {};
    try { data = await r.json(); } catch (x) {}
    if (!r.ok) throw new Error(data.error || "Something went wrong (" + r.status + ").");
    const reply = data.reply || "Sorry, I got an empty answer. Please try again.";
    bubble.textContent = reply;
    history.push({ role: "assistant", content: reply });
    save();
  } catch (err) {
    history.pop();
    bubble.textContent = err.message || "Something went wrong. Please try again.";
  }
  busy = false;
  send.disabled = false;
  t.focus();
});
</script>
</body>
</html>
