<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#212121">
<title>My AI Assistant</title>
<style>
:root{--bg:#ffffff;--text:#0d0d0d;--muted:#6e6e80;--user:#f4f4f4;--input:#f4f4f4;--border:#e5e5e5;--btn:#0d0d0d;--btn-text:#fff;--btn-off:#d0d0d0;--code:#f4f4f4;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#212121;--text:#ececec;--muted:#9b9b9b;--user:#2f2f2f;--input:#2f2f2f;--border:#3a3a3a;--btn:#ececec;--btn-text:#212121;--btn-off:#4a4a4a;--code:#171717;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
header .title{font-size:17px;font-weight:600}
.icon-btn{background:none;border:0;color:var(--text);width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.icon-btn:active{background:var(--user)}
#scroll{flex:1;overflow-y:auto}
#log{max-width:760px;margin:0 auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:22px}
.row{display:flex}
.row.user{justify-content:flex-end}
.user .bubble{background:var(--user);padding:10px 16px;border-radius:20px;max-width:82%;white-space:pre-wrap;word-wrap:break-word}
.ai .bubble{width:100%;word-wrap:break-word}
.ai .bubble p{margin:0 0 12px}
.ai .bubble p:last-child{margin-bottom:0}
.ai .bubble h3{font-size:17px;margin:16px 0 8px}
.ai .bubble ul,.ai .bubble ol{margin:0 0 12px;padding-left:22px}
.ai .bubble li{margin:4px 0}
.ai .bubble code{background:var(--code);padding:2px 6px;border-radius:6px;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace}
.ai .bubble pre{background:var(--code);padding:12px 14px;border-radius:12px;overflow-x:auto;margin:0 0 12px}
.ai .bubble pre code{padding:0;background:none}
.ai .bubble img{display:block;width:100%;max-width:380px;border-radius:14px;background:var(--user)}
.ai .bubble .imglink{display:inline-block;margin-top:8px;font-size:14px;color:var(--muted)}
.dots{display:inline-flex;gap:5px;padding:8px 0}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.status{color:var(--muted);font-size:14px;margin-top:4px}
#empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 24px}
#empty h2{font-size:28px;font-weight:600;margin:0;padding-bottom:12vh}
footer{max-width:760px;width:100%;margin:0 auto;padding:6px 12px 8px}
form{display:flex;align-items:flex-end;gap:8px;background:var(--input);border-radius:26px;padding:8px 8px 8px 8px}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;max-height:140px;padding:6px 0;line-height:1.5}
textarea::placeholder{color:var(--muted)}
.round{flex:none;width:36px;height:36px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center}
#imgBtn{background:transparent;color:var(--text)}
#imgBtn.on{background:var(--btn);color:var(--btn-text)}
#send{background:var(--btn);color:var(--btn-text)}
#send:disabled{background:var(--btn-off);color:var(--bg)}
.note{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="title">My AI Assistant</div>
  <button class="icon-btn" id="clear" type="button" aria-label="New chat">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
  </button>
</header>
<div id="scroll"><div id="log"></div></div>
<footer>
  <form id="f">
    <button class="round" id="imgBtn" type="button" aria-label="Create image">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="m21 15-5-5L5 21"/></svg>
    </button>
    <textarea id="t" rows="1" placeholder="Message"></textarea>
    <button class="round" id="send" type="submit" aria-label="Send" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
    </button>
  </form>
  <div class="note">AI can make mistakes. Check important info.</div>
</footer>
<script>
const scroller = document.getElementById("scroll");
const log = document.getElementById("log");
const t = document.getElementById("t");
const send = document.getElementById("send");
const imgBtn = document.getElementById("imgBtn");
let history = [];
let busy = false;
let imageMode = false;
let lastImage = 0;

try {
  const saved = JSON.parse(localStorage.getItem("chat"));
  if (Array.isArray(saved)) history = saved;
} catch (e) {}

function save() {
  try { localStorage.setItem("chat", JSON.stringify(history.slice(-20))); } catch (e) {}
}

function esc(s) {
  return s.replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return s;
}

function md(text) {
  const parts = text.split("```");
  let html = "";
  parts.forEach(function (p, i) {
    if (i % 2 === 1) {
      const code = p.replace(/^[^\n]*\n/, "").replace(/\n$/, "");
      html += "<pre><code>" + esc(code) + "</code></pre>";
      return;
    }
    let list = null;
    let para = [];
    function flushPara() { if (para.length) { html += "<p>" + para.join("<br>") + "</p>"; para = []; } }
    function flushList() { if (list) { html += "</" + list + ">"; list = null; } }
    p.split("\n").forEach(function (line) {
      let m;
      if ((m = line.match(/^\s*[-*]\s+(.*)/))) {
        flushPara();
        if (list !== "ul") { flushList(); html += "<ul>"; list = "ul"; }
        html += "<li>" + inline(m[1]) + "</li>";
      } else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) {
        flushPara();
        if (list !== "ol") { flushList(); html += "<ol>"; list = "ol"; }
        html += "<li>" + inline(m[1]) + "</li>";
      } else if ((m = line.match(/^#{1,6}\s+(.*)/))) {
        flushPara(); flushList();
        html += "<h3>" + inline(m[1]) + "</h3>";
      } else if (!line.trim()) {
        flushPara(); flushList();
      } else {
        flushList();
        para.push(inline(line));
      }
    });
    flushPara(); flushList();
  });
  return html;
}

function showEmpty() {
  log.innerHTML = '<div id="empty"><h2>What can I help with?</h2></div>';
}

function add(role, text) {
  const empty = document.getElementById("empty");
  if (empty) empty.remove();
  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "user" : "ai");
  const b = document.createElement("div");
  b.className = "bubble";
  if (role === "user") b.textContent = text;
  else if (text === null) b.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
  else b.innerHTML = md(text);
  row.appendChild(b);
  log.appendChild(row);
  scroller.scrollTop = scroller.scrollHeight;
  return b;
}

function refreshSend() {
  send.disabled = busy || !t.value.trim();
}

function setImageMode(on) {
  imageMode = on;
  imgBtn.classList.toggle("on", on);
  t.placeholder = on ? "Describe an image…" : "Message";
}

imgBtn.onclick = function () { setImageMode(!imageMode); t.focus(); };

if (history.length) history.forEach(function (m) { add(m.role, m.content); });
else showEmpty();

document.getElementById("clear").onclick = function () {
  if (busy) return;
  history = [];
  save();
  showEmpty();
};

t.addEventListener("input", function () {
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 140) + "px";
  refreshSend();
});

t.addEventListener("keydown", function (e) {
  const touch = "ontouchstart" in window;
  if (e.key === "Enter" && !e.shiftKey && !touch) {
    e.preventDefault();
    document.getElementById("f").requestSubmit();
  }
});

function makeImage(prompt) {
  add("user", "Image: " + prompt);
  const bubble = add("ai", null);

  const wait = 15000 - (Date.now() - lastImage);
  if (wait > 0) {
    bubble.innerHTML = '<div class="status">Please wait ' + Math.ceil(wait / 1000) + ' seconds before making another image.</div>';
    busy = false;
    refreshSend();
    return;
  }
  lastImage = Date.now();

  const seed = Math.floor(Math.random() * 1000000);
  const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt) +
    "?width=768&height=768&nologo=true&seed=" + seed;

  bubble.innerHTML = '<div class="dots"><span></span><span></span><span></span></div><div class="status">Creating your image… this can take up to a minute.</div>';

  const img = new Image();
  let done = false;
  const timer = setTimeout(function () {
    if (done) return;
    done = true;
    bubble.innerHTML = '<div class="status">The image is taking too long. Please try again in a minute.</div>';
    busy = false;
    refreshSend();
  }, 70000);

  img.onload = function () {
    if (done) return;
    done = true;
    clearTimeout(timer);
    bubble.innerHTML = "";
    bubble.appendChild(img);
    const a = document.createElement("a");
    a.className = "imglink";
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = "Open full image";
    bubble.appendChild(a);
    busy = false;
    refreshSend();
    scroller.scrollTop = scroller.scrollHeight;
  };
  img.onerror = function () {
    if (done) return;
    done = true;
    clearTimeout(timer);
    bubble.innerHTML = '<div class="status">Couldn’t create the image right now. Please try again in a minute.</div>';
    busy = false;
    refreshSend();
  };
  img.alt = prompt;
  img.src = url;
}

document.getElementById("f").addEventListener("submit", async function (e) {
  e.preventDefault();
  let text = t.value.trim();
  if (!text || busy) return;

  let wantsImage = imageMode;
  if (/^\/image\s+/i.test(text)) {
    wantsImage = true;
    text = text.replace(/^\/image\s+/i, "").trim();
    if (!text) return;
  }

  busy = true;
  t.value = "";
  t.style.height = "auto";
  refreshSend();

  if (wantsImage) {
    makeImage(text);
    return;
  }

  history.push({ role: "user", content: text });
  add("user", text);
  const bubble = add("ai", null);
  try {
    const r = await fetch("/.netlify/functions/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history.slice(-12) })
    });
    let data = {};
    try { data = await r.json(); } catch (x) {}
    if (!r.ok) throw new Error(data.error || "Something went wrong (" + r.status + ").");
    const reply = data.reply || "Sorry, I got an empty answer. Please try again.";
    bubble.innerHTML = md(reply);
    history.push({ role: "assistant", content: reply });
    save();
  } catch (err) {
    history.pop();
    bubble.textContent = err.message || "Something went wrong. Please try again.";
  }
  busy = false;
  refreshSend();
  scroller.scrollTop = scroller.scrollHeight;
});
</script>
</body>
</html>
